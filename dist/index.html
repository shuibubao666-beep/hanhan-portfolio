<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="刘含颖的交互作品集">
  <title>刘含颖 · Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #edf2f6; color: #29434c; font: 14px system-ui, sans-serif; }
    header { display: flex; justify-content: center; align-items: center; padding: 8px 12px; }
    label { display: flex; align-items: center; gap: 10px; padding: 5px 12px; border: 1px solid #afbec9; border-radius: 24px; background: white; }
    input { width: clamp(84px, 25vw, 150px); min-height: 24px; accent-color: #925171; }
    output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
    main { display: grid; place-items: center; min-height: 0; }
    iframe { width: var(--size); height: var(--size); max-width: calc(100% - 16px); max-height: calc(100% - 16px); border: 0; border-radius: 10px; background: #dbeaf4; box-shadow: 0 6px 24px #29434c26; }
  </style>
</head>
<body>
  <header><label for="size">画布大小 <input type="range" id="size" min="60" max="100" step="5" value="85"><output for="size">85%</output></label></header>
  <main><iframe title="刘含颖的作品集" style="--size:85%" allow="fullscreen"></iframe></main>
  <script>
    const control = document.querySelector('#size');
    const output = document.querySelector('output');
    const frame = document.querySelector('iframe');
    const preference = 'portfolio-canvas-size';
    const finale = /\/finale\.html$/.test(location.pathname);
    const scene = finale ? 'finale-scene.html' : 'portfolio-scene.html';

    function resize() {
      const size = `${control.value}%`;
      output.value = size;
      frame.style.setProperty('--size', size);
    }

    try { control.value = localStorage.getItem(preference) || '85'; } catch {}
    resize();
    control.addEventListener('input', () => {
      resize();
      try { localStorage.setItem(preference, control.value); } catch {}
    });

    function syncAddress() {
      const inner = frame.contentWindow.location;
      if (!/\/(portfolio|finale)-scene\.html$/.test(inner.pathname)) return;
      const outer = new URL(inner.pathname.endsWith('/finale-scene.html') ? 'finale.html' : 'index.html', location.href);
      if (outer.pathname.endsWith('/index.html') && location.pathname.endsWith('/')) outer.pathname = location.pathname;
      outer.search = location.search;
      outer.hash = inner.hash;
      if (outer.href !== location.href) history.replaceState(null, '', outer);
    }

    frame.addEventListener('load', () => {
      frame.contentWindow.addEventListener('hashchange', syncAddress);
      syncAddress();
    });
    window.addEventListener('hashchange', () => {
      if (frame.contentWindow.location.hash !== location.hash) frame.contentWindow.location.hash = location.hash;
    });
    frame.src = scene + location.hash;
  </script>
</body>
</html>
